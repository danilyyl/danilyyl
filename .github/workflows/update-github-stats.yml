name: Atualizar GitHub Stats

on:
  schedule:
    - cron: '0 * * * *' # roda a cada hora
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Baixar GitHub Stats
        run: |
          curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -o github-stats.svg \
          "https://github-readme-stats.vercel.app/api?username=danilyyl&show_icons=true&count_private=true&theme=radical"
          
          curl -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
          -o top-langs.svg \
          "https://github-readme-stats.vercel.app/api/top-langs?username=danilyyl&layout=compact&langs_count=5&theme=radical"

      - name: Commit das estatísticas
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          git add github-stats.svg top-langs.svg
          git commit -m "Atualizar GitHub Stats [skip ci]" || echo "Sem mudanças para commitar"
          git push
