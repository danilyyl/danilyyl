name: Atualizar GitHub Stats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Gerar GitHub Stats
        run: |
          curl -L -o github-stats.svg \
          "https://github-readme-stats.vercel.app/api?username=danilyyl&show_icons=true&theme=tokyonight"

          curl -L -o top-langs.svg \
          "https://github-readme-stats.vercel.app/api/top-langs/?username=danilyyl&layout=compact&theme=tokyonight"

      - name: Commit das estatísticas
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"

          git add github-stats.svg top-langs.svg

          git commit -m "Atualizar GitHub Stats [skip ci]" || echo "Sem mudanças"

          git push
